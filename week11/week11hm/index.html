<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nicks Video Games Events</title>
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
</head>
<body>
    <main>
        <h1 id="title">Video Games</h1>
        <!-- Theme toggle section -->
        <button id="themeToggle">Toggle Theme</button>
        <!-- Section to add/remove list items -->
        <section>
        <h2>My Game List</h2>
        <button id="addItem">Add Games</button>
        <ul id="items"></ul>
        </section>
        <!-- Section that reacts to keyboard -->
        <section>
        <h2>Keyboard Demo</h2>
        <p  id="keyOutput">Press any key…</p>
        </section>
    </main>

</body>
</html>
