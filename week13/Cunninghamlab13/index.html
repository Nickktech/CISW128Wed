<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 13 - Form Validation</title>

    <style>
        .error {
            color: red;
        }
        h1{
            color: green;
        }
        body{
            background-color: black;
            color: azure;
        }
        form{
            display: grid;
        }

        .success {
            color: green;
        }

        form {
            display: grid;
            gap: 10px;
            max-width: 400px;
        }

        label {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Contact Form</h1>
<br>
 <br>
 <!-- name -->
    <form id="contactform" novalidate></form>
    <label for="username">Name</label>
    <input id="username" type="text" placeholder="Your name" required>
    <p id="nameError" class="error"></p>
 <br>
 <br>
 <!-- email -->
    <label for="email">Email:</label>
    <input id="email" type="email" placeholder="you@example.com" required />
    <p id="emailError" class="error"></p>
<br>
<br>
<!-- age -->
    <label for="age">Age</label>
    <input type="number" id="age" placeholder="Enter your age" min="1" required>
    <p id="ageError" class="error"></p>

<button type="submit">Submit</button>

<!-- verification -->
    <p id="successMessage" class="success"></p>


    <script src="scripts.js"></script>
</body>
</html>
