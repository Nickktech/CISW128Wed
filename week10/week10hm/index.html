<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css">
  <title>Video Games — DOM Homework</title>
  <style>
    /* You choose the class name */
    .[yourHighlightClass] { background: #fff3cd; transition: background 200ms; }
    .[yourDarkClass] { background:#111; color:#eee; }
  </style>
</head>
<body>
  <header>
    <h1 id="[yourTitleId]">Video games</h1>
  </header>

  <main id="[mainid]">


    <p class="[yourIntroClass]">Welcome! This page will update with JavaScript.</p>

    <!-- List target you will render into -->
    <ul id="[yourListId]"></ul>

    <!-- Image you will update -->
    <img id="[yourImgId]" src="gamesss.webp" alt="best 100 games" />



    <p id ="gamep1">
    This is my game paragraph
    </p>




    <!-- Buttons you will wire up -->
    <button id="[yourToggleBtnId]">Toggle Highlight</button>
    <button id="[yourSwapBtnId]">Swap Image</button>
  </main>

  <footer id="[yourFooterId]">© 2025 [Nicolas Cunningham]</footer>

  <script src="scripts.js"></script>
</body>
</html>
